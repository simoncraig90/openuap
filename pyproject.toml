[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openuap"
version = "0.1.0"
description = "Consolidated, AI-queryable database of UFO/UAP reports (SQLite + FTS5 + MCP server)"
requires-python = ">=3.10"
dependencies = ["mcp>=2.0", "anthropic>=1.0"]

[project.scripts]
openuap = "openuap.cli:main"

[tool.setuptools]
packages = ["openuap", "openuap.sources"]

[tool.setuptools.package-data]
openuap = ["schema.sql"]
